services:
  e2mail:
    #   docker compose up -d --build
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-vdev}
        BUILD_TIME: ${BUILD_TIME:-timeless}
        COMMIT_HASH: ${COMMIT_HASH:-sha-unknown}
    image: ghcr.io/johnwmail/e2mail:latest
    container_name: e2mail
    user: "8080:8080"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8080:8080"
    environment:
      - PORT=${PORT:-8080}
      - DATA_DIR=${DATA_DIR:-/data}
      - SESSION_TTL_HOURS=${SESSION_TTL_HOURS:-24}
      - SESSION_SECRET=${SESSION_SECRET:-}
      - COOKIE_SECURE=${COOKIE_SECURE:-true}
      # === Onboarding 強制設定（新帳號首次登入；true=強制要求設 2FA / PGP） ===
      # 可直接喺呢度寫死，或用 .env / shell env 覆蓋（default 都係 true）
      - REQUIRE_2FA=${REQUIRE_2FA:-true}
      - REQUIRE_PGP=${REQUIRE_PGP:-true}
      # === 伺服器預設值（自訂網域登入時預填；ADMIN 若部署給多人使用可設定） ===
      # - DEFAULT_IMAP_HOST=mail.example.com
      # - DEFAULT_IMAP_PORT=993
      # - DEFAULT_SMTP_HOST=mail.example.com
      # - DEFAULT_SMTP_PORT=587
      # - DEFAULT_ALLOW_INSECURE_TLS=false    # 預設為 false；僅在自簽憑證環境顯式設為 true
      # - DEFAULT_SIEVE_HOST=mail.example.com
      # - DEFAULT_SIEVE_PORT=4190
      # - DEFAULT_SIEVE_USE_TLS=true
      # - DEFAULT_SIEVE_ALLOW_INSECURE_TLS=false
      # === LDAP 變更密碼（OpenBSD ldapd；詳見 LDAP.md；建議放 .env / secret 注入） ===
      # - LDAP_ENABLED=true
      # - LDAP_URL=ldaps://ldap.example.com:636
      # - LDAP_ROOT_DN=cn=e2mail,dc=example,dc=com
      # - LDAP_ROOT_PW=${LDAP_ROOT_PW:-}      # ⚠️ 敏感：用 env/secret，唔好寫死喺呢度
      # - LDAP_USER_DN_TEMPLATE=uid=%s,ou=people,dc=example,dc=com
      # - LDAP_CA_FILE=/certs/rootCA.crt         # 自簽 RootCA 容器內路徑（需配合 volumes 掛載）
      # - LDAP_ALLOW_INSECURE_TLS=false
    volumes:
      - e2mail-data:/data
      # 自簽 CA 例子（將宿主機 ./certs/rootCA.crt 掛到容器 /certs/rootCA.crt）：
      # - ./certs/rootCA.crt:/certs/rootCA.crt:ro
    networks:
      - e2mail-net

volumes:
  # NOTE: older images used `webmail-data`. If upgrading from a prior install,
  # the PGP keyring + DB already live there; one-time migrate:
  #   docker run --rm -v webmail-data:/from -v e2mail-data:/to alpine cp -a /from/. /to/
  e2mail-data:
    driver: local

networks:
  e2mail-net:
    driver: bridge
