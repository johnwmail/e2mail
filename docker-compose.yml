services:
  e2mail:
    #   docker compose up -d --build
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-vdev}
        BUILD_TIME: ${BUILD_TIME:-timeless}
        COMMIT_HASH: ${COMMIT_HASH:-sha-unknown}
    image: ghcr.io/johnwmail/e2mail:latest
    container_name: e2mail
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DATA_DIR=/data
      - SESSION_TTL_HOURS=24
      # === 伺服器預設值（自訂網域登入時預填；ADMIN 若部署給多人使用可設定） ===
      # - DEFAULT_IMAP_HOST=mail.example.com
      # - DEFAULT_IMAP_PORT=993
      # - DEFAULT_SMTP_HOST=mail.example.com
      # - DEFAULT_SMTP_PORT=587
      # - DEFAULT_ALLOW_INSECURE_TLS=false    # 預設為 false；僅在自簽憑證環境顯式設為 true
    volumes:
      - e2mail-data:/data
    networks:
      - e2mail-net

volumes:
  # NOTE: older images used `webmail-data`. If upgrading from a prior install,
  # the PGP keyring + DB already live there; one-time migrate:
  #   docker run --rm -v webmail-data:/from -v e2mail-data:/to alpine cp -a /from/. /to/
  e2mail-data:
    driver: local

networks:
  e2mail-net:
    driver: bridge
