name: Auto-merge Dependabot PRs

on: pull_request

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-merge-dependabot-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  PR_URL: ${{ github.event.pull_request.html_url }}
  # Optional configuration variables (Settings -> Secrets and variables -> Actions -> Variables).
  # They can be set at repository or organisation level; unset falls back to the defaults below.
  #   DEPENDABOT_AUTO_MERGE_METHOD  squash | merge | rebase   (default: squash)
  #   DEPENDABOT_AUTO_MERGE_MAJOR   true | false              (default: false)
  MERGE_METHOD: ${{ vars.DEPENDABOT_AUTO_MERGE_METHOD || 'squash' }}
  AUTO_MERGE_MAJOR: ${{ vars.DEPENDABOT_AUTO_MERGE_MAJOR || 'false' }}

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Portable guard instead of a hardcoded repo name:
    #   - skips forks that inherit this file,
    #   - only Dependabot-authored PRs,
    #   - set the DEPENDABOT_AUTO_MERGE variable to "false" to switch it off per repo/org.
    # Note: only github/needs/vars/inputs are available here, not env or secrets.
    if: >-
      !github.event.repository.fork &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      (vars.DEPENDABOT_AUTO_MERGE || 'true') == 'true'
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Dependabot-triggered runs get a read-only GITHUB_TOKEN by default; the permissions
      # block above is what raises it, so these two steps can review and merge.
      # semver-major bumps stay manual by default: green CI does not prove a major is safe.
      - name: Approve PR
        if: env.AUTO_MERGE_MAJOR == 'true' || steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr review --approve "$PR_URL"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge
        if: env.AUTO_MERGE_MAJOR == 'true' || steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --"$MERGE_METHOD" "$PR_URL"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
