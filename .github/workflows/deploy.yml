name: deploy

# Deploy 到遠端伺服器 —— 僅當「container」workflow（build & push 鏡像）成功後先執行。
#
# GitHub Actions 唔支援跨 workflow 嘅 `needs:`，所以用 `workflow_run` 觸發器：
# 當 `container` workflow 完成後，呢個 workflow 先會被啟動，並用
# `conclusion == 'success'` 確保 build 成功先部署。
#
# 需要喺 GitHub repo Secrets 設定：
#   DEPLOY_HOST     遠端主機 IP / hostname（例如 e2mail.wonghome.net）
#   DEPLOY_USER     SSH 登入用戶
#   DEPLOY_SSH_KEY  SSH 私鑰（用 OpenSSH 格式，整段貼上）
#   DEPLOY_PORT     SSH port（預設 22）
#   DEPLOY_CMD      要喺遠端執行嘅部署指令。可使用 $DEPLOY_TAG 環境變數引用 tag 版本。
#
# 例子 DEPLOY_CMD（用 tag 版本 pull 鏡像 + 重啟）：
#   cd /opt/e2mail && docker compose pull && docker compose up -d
#
# 若要用「而家 tag 版本」做 pull，可將 DEPLOY_CMD 設為：
#   export IMAGE=ghcr.io/johnwmail/e2mail:$DEPLOY_TAG
#   cd /opt/e2mail && docker compose pull ghcr.io/johnwmail/e2mail:$DEPLOY_TAG && docker compose up -d
#
# 注意：DEPLOY_CMD 係 secret，唔會被顯示；$DEPLOY_TAG 會經 envs 注入到 SSH 遠端環境。

on:
  workflow_run:
    workflows: ["container"]
    types: [completed]

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'v')

    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}

    steps:
      - name: Extract tag version
        id: tag
        run: echo "dep_tag=${{ github.event.workflow_run.head_branch }}" >> "$GITHUB_OUTPUT"

      - name: Skip if no deploy host configured
        if: env.DEPLOY_HOST == ''
        run: |
          echo "::notice::DEPLOY_HOST secret not set — skipping deployment."
          echo "To enable deployment, add DEPLOY_HOST, DEPLOY_PORT, DEPLOY_USER, DEPLOY_SSH_KEY, and DEPLOY_CMD secrets."

      - name: Deploy to remote host
        if: env.DEPLOY_HOST != ''
        env:
          DEPLOY_TAG: ${{ steps.tag.outputs.dep_tag }}
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          envs: DEPLOY_TAG
          script: |
            echo "Deploying e2mail tag: ${DEPLOY_TAG}"
            ${{ secrets.DEPLOY_CMD }}

      - name: Report deployment result
        if: always()
        run: echo "Deployment finished (conclusion: ${{ job.status }})"
