name: container

# Build & push container image（tag push 觸發）。build 成功後 deploy job 先會啟動。
#
# Deploy job 需要喺 GitHub repo Secrets 設定：
#   DEPLOY_HOST     遠端主機 IP / hostname
#   DEPLOY_USER     SSH 登入用戶
#   DEPLOY_SSH_KEY  SSH 私鑰（OpenSSH 格式）
#   DEPLOY_PORT     SSH port
#   DEPLOY_CMD      遠端部署指令。可用環境變數：
#                     $DEPLOY_TAG    tag 版本（例如 v0.1.17）
#                     $DEPLOY_REPO   倉庫名（例如 e2mail）
# 例子：cd /opt/$DEPLOY_REPO && docker compose pull ghcr.io/johnwmail/$DEPLOY_REPO:$DEPLOY_TAG && docker compose up -d
#
# 注意：workflow_run 觸發器唔可以經 tag push 觸發（只追蹤 default branch），
# 所以 deploy 直接做成本 workflow 入面一個 job（needs: build）保證順序。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build & push container image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # secrets is not allowed in step `if:`; compute the flag via `env` instead.
    env:
      DOCKER_HUB_ENABLED: ${{ secrets.DOCKER_USERNAME != '' && secrets.DOCKER_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve build metadata
        id: meta
        run: echo "build_time=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (for multi-arch codegen)
        uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub (only if credentials are configured)
        uses: docker/login-action@v4
        if: env.DOCKER_HUB_ENABLED == 'true'
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Compose push tags
        id: tags
        run: |
          TAGS="ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          ghcr.io/${{ github.repository }}:latest"
          if [ "$DOCKER_HUB_ENABLED" = "true" ]; then
            TAGS="$TAGS
          docker.io/${{ secrets.DOCKER_USERNAME }}/e2mail:${{ github.ref_name }}
          docker.io/${{ secrets.DOCKER_USERNAME }}/e2mail:latest"
          fi
          # GITHUB_OUTPUT is single-line per assignment; use a heredoc delimiter
          # so the newline-separated tag list survives as one value.
          {
            echo "tags<<EOF"
            printf '%s\n' "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build & push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            VERSION=${{ github.ref_name }}
            BUILD_TIME=${{ steps.meta.outputs.build_time }}
            COMMIT_HASH=${{ github.sha }}

  # Deploy 喺 build 成功後執行（同一個 workflow 檔案用 needs: build 保證順序）。
  # 只喺 tag push（github.ref_name 係 tag 名）時部署；workflow_dispatch 手動跑唔部署。
  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}

    steps:
      - name: Skip if no deploy host configured
        if: env.DEPLOY_HOST == ''
        run: |
          echo "::notice::DEPLOY_HOST secret not set — skipping deployment."
          echo "To enable deployment, add DEPLOY_HOST, DEPLOY_PORT, DEPLOY_USER, DEPLOY_SSH_KEY, and DEPLOY_CMD secrets."

      - name: Deploy to remote host
        if: env.DEPLOY_HOST != ''
        env:
          DEPLOY_TAG: ${{ github.ref_name }}
          DEPLOY_REPO: ${{ github.event.repository.name }}
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          envs: DEPLOY_TAG, DEPLOY_REPO
          script: |
            echo "Deploying ${DEPLOY_REPO} tag: ${DEPLOY_TAG}"
            ${{ secrets.DEPLOY_CMD }}