name: container

permissions:
  contents: read

# Build & push container image（tag push 觸發）。
# 部署已分離到獨立嘅 deploy.yml，只可經 workflow_dispatch 手動觸發。
#
# workflow_dispatch 可手動觸發 build：輸入 tag 覆蓋預設。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build（例如 v0.6.2，留空則用當前 ref）'
        required: false
        type: string

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build & push container image
    runs-on: ubuntu-latest
    # push 只喺 tag 先跑；workflow_dispatch 允許手動指定 tag
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
    # secrets is not allowed in step `if:`; compute the flag via `env` instead.
    env:
      DOCKER_HUB_ENABLED: ${{ secrets.DOCKER_USERNAME != '' && secrets.DOCKER_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve build metadata
        id: meta
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          # workflow_dispatch 喺 branch 上觸發但未填 tag 時，github.ref_name 係 branch 名，必須攔截
          if [[ "$TAG" == "main" || "$TAG" == "master" ]]; then
            echo "::error::workflow_dispatch 需填寫 tag（例如 v0.6.2）"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (for multi-arch codegen)
        uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub (only if credentials are configured)
        uses: docker/login-action@v4
        if: env.DOCKER_HUB_ENABLED == 'true'
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Compose push tags
        id: tags
        env:
          TAG_NAME: ${{ steps.meta.outputs.tag }}
        run: |
          TAGS="ghcr.io/${{ github.repository }}:${TAG_NAME}
          ghcr.io/${{ github.repository }}:latest"
          if [ "$DOCKER_HUB_ENABLED" = "true" ]; then
            TAGS="$TAGS
          docker.io/${{ secrets.DOCKER_USERNAME }}/e2mail:${TAG_NAME}
          docker.io/${{ secrets.DOCKER_USERNAME }}/e2mail:latest"
          fi
          # GITHUB_OUTPUT is single-line per assignment; use a heredoc delimiter
          # so the newline-separated tag list survives as one value.
          {
            echo "tags<<EOF"
            printf '%s\n' "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build & push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            VERSION=${{ steps.meta.outputs.tag }}
            BUILD_TIME=${{ steps.meta.outputs.build_time }}
            COMMIT_HASH=${{ github.sha }}
