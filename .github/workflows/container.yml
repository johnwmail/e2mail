name: container

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build & push container image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # secrets is not allowed in step `if:`; compute the flag via `env` instead.
    env:
      DOCKER_HUB_ENABLED: ${{ secrets.DOCKER_USERNAME != '' && secrets.DOCKER_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve build metadata
        id: meta
        run: echo "build_time=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (for multi-arch codegen)
        uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub (only if credentials are configured)
        uses: docker/login-action@v4
        if: env.DOCKER_HUB_ENABLED == 'true'
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Compose push tags
        id: tags
        run: |
          TAGS="ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          ghcr.io/${{ github.repository }}:latest"
          if [ "$DOCKER_HUB_ENABLED" = "true" ]; then
            TAGS="$TAGS
          docker.io/${{ secrets.DOCKER_USERNAME }}/e2mail:${{ github.ref_name }}
          docker.io/${{ secrets.DOCKER_USERNAME }}/e2mail:latest"
          fi
          # GITHUB_OUTPUT is single-line per assignment; use a heredoc delimiter
          # so the newline-separated tag list survives as one value.
          {
            echo "tags<<EOF"
            printf '%s\n' "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build & push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            VERSION=${{ github.ref_name }}
            BUILD_TIME=${{ steps.meta.outputs.build_time }}
            COMMIT_HASH=${{ github.sha }}