name: openbsd

permissions:
  contents: read

# Build the single, statically linked OpenBSD binary (frontend embedded).
# - v* tags: also attach the binary to the GitHub release
on:
  push:
    tags: ['v*']

jobs:
  build:
    name: Build openbsd/amd64
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Compute build metadata
        id: meta
        run: |
          echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +%FT%TZ)" >> "$GITHUB_OUTPUT"
          echo "commit=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_APP_VERSION: ${{ steps.meta.outputs.version }}
          VITE_APP_BUILD_TIME: ${{ steps.meta.outputs.build_time }}
          VITE_APP_COMMIT_HASH: ${{ steps.meta.outputs.commit }}
        run: |
          npm ci
          npm run build

      - name: Embed frontend into the Go binary
        run: |
          rm -rf backend/web/dist/*
          cp -r frontend/dist/* backend/web/dist/

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Build openbsd/amd64 (CGO disabled, static)
        working-directory: backend
        env:
          CGO_ENABLED: '0'
          GOOS: openbsd
          GOARCH: amd64
        run: |
          mkdir -p ../dist
          go build -trimpath \
            -ldflags "-s -w \
              -X main.Version=${{ steps.meta.outputs.version }} \
              -X main.BuildTime=${{ steps.meta.outputs.build_time }} \
              -X main.CommitHash=${{ steps.meta.outputs.commit }}" \
            -o ../dist/e2mail-openbsd-amd64 ./cmd/server

      - name: Inspect artifact
        run: file dist/e2mail-openbsd-amd64 && ls -lh dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: e2mail-openbsd-amd64
          path: dist/e2mail-openbsd-amd64
          if-no-files-found: error

  release:
    name: Attach openbsd/amd64 to release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: e2mail-openbsd-amd64
          path: dist

      - name: Upload to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/e2mail-openbsd-amd64
